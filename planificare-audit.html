<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planificare Audit — Scriptica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css?v=16">
  <link rel="stylesheet" href="css/base.css?v=14">
  <link rel="stylesheet" href="css/components.css?v=20">
  <link rel="stylesheet" href="css/administrare.css?v=20">
  <link rel="stylesheet" href="css/planificare-audit.css?v=1">
</head>
<body data-page="planificare-audit">
  <div class="shell shell--messaging-closed">

    <header class="header" role="banner">
      <div class="header__left">
        <a href="acasa.html" class="header__logo-link" aria-label="Scriptica, pagina principală">
          <img src="assets/logo-scriptica.png" alt="Scriptica" class="header__logo">
        </a>
      </div>
      <div class="header__center">
        <div class="header__search" role="search">
          <label for="header-search" class="sr-only">Caută în aplicație</label>
          <input id="header-search" class="header__search-input" type="search" placeholder="Caută în aplicație" autocomplete="off">
          <span class="material-symbols-outlined header__search-icon" aria-hidden="true">search</span>
        </div>
      </div>
      <div class="header__right">
        <div class="header__timer" id="header-timer" hidden>
          <a class="timer-pill" href="#">
            <span class="timer-pill__dot" aria-hidden="true"></span>
            <span class="timer-pill__time">00:00:00</span>
            <span class="timer-pill__meta">
              <span class="timer-pill__task"></span>
              <span class="timer-pill__client"></span>
            </span>
          </a>
          <button class="timer-pill__stop" type="button" aria-label="Oprește cronometrul">
            <span class="material-symbols-outlined" aria-hidden="true">stop_circle</span>
          </button>
        </div>
        <span class="header__welcome">Bine ai venit, <strong data-welcome-name>Anca</strong></span>
        <button class="header__icon-btn header__user" type="button" aria-label="Meniu utilizator">
          <span class="material-symbols-outlined" aria-hidden="true">person</span>
        </button>
        <button class="header__icon-btn header__notification" type="button" aria-label="Notificări">
          <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
          <span class="header__badge" aria-hidden="true">3</span>
        </button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Navigație principală">
      <button class="sidebar__burger" type="button" aria-label="Extinde/restrânge meniul">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
      <nav class="sidebar__nav" aria-label="Secțiuni">
        <a class="nav-item" href="acasa.html">
          <span class="material-symbols-outlined nav-item__icon" aria-hidden="true">home</span>
          <span class="nav-item__label">Acasă</span>
        </a>
        <a class="nav-item" href="situatii.html">
          <span class="material-symbols-outlined nav-item__icon" aria-hidden="true">fact_check</span>
          <span class="nav-item__label">Situații Contabile</span>
        </a>
        <a class="nav-item" href="time-tracking.html">
          <span class="material-symbols-outlined nav-item__icon" aria-hidden="true">timer</span>
          <span class="nav-item__label">Time Tracking</span>
        </a>
        <a class="nav-item" href="arhiva.html">
          <span class="material-symbols-outlined nav-item__icon" aria-hidden="true">archive</span>
          <span class="nav-item__label">Arhivă</span>
        </a>
      </nav>
    </aside>

    <main class="main" id="main" role="main">

      <header class="page-header">
        <h1 class="page-header__title">Planificare Audit</h1>
      </header>

      <div class="plan-section-title">Plan multianual</div>
      <div id="plan-multianual"></div>

      <div class="plan-section-title">Plan anual</div>
      <section class="docs-section" id="plan-anual" aria-label="Plan anual"></section>

    </main>

  </div>

  <!-- Modal: editare plan multianual (admin) -->
  <div class="modal" id="modal-plan-edit" role="dialog" aria-modal="true" aria-labelledby="mpe-title" aria-hidden="true">
    <div class="modal__dialog modal__dialog--wide" role="document">
      <button type="button" class="modal__close" data-modal-close aria-label="Închide fereastra">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
      <header class="modal__header">
        <h2 class="modal__title" id="mpe-title">Editează planul multianual</h2>
      </header>
      <form class="modal__body" novalidate>
        <div class="form-field" data-field="nume">
          <label class="form-label" for="mpe-nume">Denumire plan*</label>
          <input id="mpe-nume" type="text" class="input" autocomplete="off">
          <span class="form-error" role="alert"></span>
        </div>
        <div class="admin-form-row">
          <div class="form-field" data-field="from">
            <label class="form-label" for="mpe-from">An început*</label>
            <input id="mpe-from" type="number" class="input" min="2020" max="2100" step="1">
            <span class="form-error" role="alert"></span>
          </div>
          <div class="form-field" data-field="to">
            <label class="form-label" for="mpe-to">An sfârșit*</label>
            <input id="mpe-to" type="number" class="input" min="2020" max="2100" step="1">
            <span class="form-error" role="alert"></span>
          </div>
          <div class="form-field" data-field="status">
            <label class="form-label" for="mpe-status">Status</label>
            <select id="mpe-status" class="select">
              <option value="aprobat">Aprobat</option>
              <option value="ciorna">Ciornă</option>
            </select>
          </div>
        </div>
        <div class="form-field" data-field="missions">
          <label class="form-label" for="mpe-missions">Misiuni orientative</label>
          <span class="form-helper">Câte o misiune pe linie. Se rafinează ulterior în planul anual.</span>
          <textarea id="mpe-missions" class="textarea plan-edit-missions"></textarea>
        </div>
      </form>
      <footer class="modal__footer">
        <span class="modal__footer-helper">* Câmpuri obligatorii</span>
        <button type="button" class="btn btn--ghost" data-modal-cancel>Anulează</button>
        <button type="button" class="btn btn--primary" id="mpe-save">Salvează</button>
      </footer>
    </div>
  </div>

  <!-- Toast stack -->
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script src="js/shell.js?v=35"></script>
  <script src="js/mock-data.js?v=54"></script>
  <script src="js/timer.js?v=30"></script>
  <script src="js/dashboard.js?v=34"></script>
  <script src="js/planificare-audit.js?v=1"></script>
</body>
</html>
